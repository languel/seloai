<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SeloAI music lab</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #2a2826;
        color: #e9e3d6;
        font: 13px/1.45 ui-sans-serif, system-ui, sans-serif;
      }
      h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
      h2 { margin: 18px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #c9bfa9; }
      p.hint { color: #a9a294; margin: 0 0 12px; max-width: 70ch; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
      button, select, input[type='number'] {
        background: transparent; color: inherit; border: 1px solid #6b6458; border-radius: 3px;
        padding: 4px 9px; font: inherit; cursor: pointer;
      }
      button:hover { border-color: #e9e3d6; }
      button.on { background: #e9e3d6; color: #2a2826; border-color: #e9e3d6; }
      input[type='range'] { width: 320px; accent-color: #c0392b; }
      textarea { width: min(640px, 100%); height: 64px; background: transparent; color: inherit; border: 1px solid #6b6458; border-radius: 3px; font: inherit; padding: 6px; }
      canvas { display: block; width: 100%; height: 300px; border: 1px solid #4a453d; border-radius: 3px; margin-top: 8px; }
      #now { font-variant-numeric: tabular-nums; color: #e9e3d6; }
      #reason { color: #d9a441; }
      #log { color: #a9a294; font-size: 12px; max-height: 140px; overflow: auto; margin-top: 6px; font-variant-numeric: tabular-nums; }
      label { color: #c9bfa9; }
      .legend span { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 10px; vertical-align: -1px; }
    </style>
  </head>
  <body>
    <div id="lab"></div>
    <script type="module" src="/src/music/lab.ts"></script>
  </body>
</html>
